<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark minimal background gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="60%" stop-color="#0d0d12" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Arc / Anarchy accent gradient -->
    <linearGradient id="anarchy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#e01b24" />
      <stop offset="100%" stop-color="#990024" />
    </linearGradient>

    <!-- Larva segments metallic/cyber gradient -->
    <linearGradient id="body-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#d6deeb" />
      <stop offset="70%" stop-color="#8993a4" />
      <stop offset="100%" stop-color="#3b4252" />
    </linearGradient>

    <!-- Subtle neon rim glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="arc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bg-glow)" />

  <!-- Outer Broken Arch Ring (Arch / Anarchy O-ring homage) -->
  <circle cx="256" cy="245" r="185" fill="none" stroke="#222533" stroke-width="4" stroke-dasharray="14 10" />

  <g filter="url(#arc-glow)">
    <!-- Aggressive Anarchist Cross Slash (Omarchy vibe) -->
    <path d="M 120 285 L 396 240" stroke="url(#anarchy-grad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 100 295 L 420 235" stroke="#ff3366" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Segmented Cyber-Larva (Опарыш) forming the Anarchy / Arch apex -->
  <!-- Tail segment (bottom-left) -->
  <ellipse cx="185" cy="355" rx="26" ry="18" transform="rotate(-30 185 355)" fill="url(#body-grad)" />
  <path d="M 172 368 C 185 360, 195 348, 198 342" stroke="#1e222a" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Lower Body segment -->
  <ellipse cx="208" cy="308" rx="36" ry="24" transform="rotate(-48 208 308)" fill="url(#body-grad)" />
  <path d="M 190 326 C 210 315, 222 296, 224 288" stroke="#1e222a" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Mid Body segment -->
  <ellipse cx="236" cy="254" rx="44" ry="28" transform="rotate(-62 236 254)" fill="url(#body-grad)" />
  <path d="M 218 274 C 238 258, 252 236, 254 226" stroke="#1e222a" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Chest segment -->
  <ellipse cx="266" cy="196" rx="46" ry="30" transform="rotate(-75 266 196)" fill="url(#body-grad)" />
  <path d="M 248 214 C 268 196, 282 176, 283 166" stroke="#1e222a" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Head segment (Top peak of the Arch) -->
  <ellipse cx="290" cy="138" rx="38" ry="27" transform="rotate(-84 290 138)" fill="url(#body-grad)" />

  <!-- Cyber Fangs / Mandibles (Aggressive minimal spikes) -->
  <path d="M 280 115 L 292 90 L 296 114 Z" fill="#ff3366" />
  <path d="M 300 118 L 315 96 L 312 121 Z" fill="#e01b24" />

  <!-- Neon Sensor / Larva Eye Spike -->
  <circle cx="282" cy="132" r="5" fill="#ff3366" filter="url(#neon-glow)" />
  <circle cx="282" cy="132" r="2.5" fill="#ffffff" />

  <!-- Sharpened Anarchy Arrow Tip (Omarchy aesthetic accent) -->
  <path d="M 405 220 L 435 233 L 410 252 Z" fill="#ff3366" filter="url(#neon-glow)" />

  <!-- Typography: OPARYSHI LINUX -->
  <text x="256" y="435" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-size="28" font-weight="900" letter-spacing="9">OPARYSHI</text>

  <text x="256" y="462" text-anchor="middle" fill="#ff3366" font-family="monospace, &#39;Courier New&#39;" font-size="13" font-weight="700" letter-spacing="6">LINUX</text>
</svg>
